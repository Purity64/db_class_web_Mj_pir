<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ / ลงทะเบียน</title>
  <!-- Google Fonts (Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Container -->
  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden p-6 sm:p-8 border border-slate-100">
    
    <!-- Tab Switcher (สลับระหว่าง Login / Register) -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="tab-login" onclick="switchTab('login')" class="w-1/2 pb-3 text-center text-lg font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-all cursor-pointer">
        เข้าสู่ระบบ
      </button>
      <button id="tab-register" onclick="switchTab('register')" class="w-1/2 pb-3 text-center text-lg font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all cursor-pointer">
        สมัครสมาชิก
      </button>
    </div>

    <!-- Login Form -->
    <form id="form-login" action="" method="post" class="flex flex-col space-y-4">
      <div class="text-center mb-2">
        <h1 class="text-2xl font-bold text-slate-800">ยินดีต้อนรับกลับมา</h1>
        <p class="text-sm text-slate-500 mt-1">กรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
      </div>

      <div>
        <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
        <input type="email" id="login-email" name="email" required placeholder="name@example.com" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="login-password" class="block text-sm font-medium text-slate-700">รหัสผ่าน</label>
        </div>
        <input type="password" id="login-password" name="password" required placeholder="••••••••" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>



      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md transition-all active:scale-[0.98] cursor-pointer">
        Sign In
      </button>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="form-register" action="" method="post" class="hidden flex-col space-y-4">
      <div class="text-center mb-2">
        <h1 class="text-2xl font-bold text-slate-800">สร้างบัญชีใหม่</h1>
        <p class="text-sm text-slate-500 mt-1">เริ่มต้นใช้งานฟรีได้แล้ววันนี้</p>
      </div>

      <div>
        <label for="reg-name" class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-นามสกุล</label>
        <input type="text" id="reg-name" name="name" required placeholder="สมชาย ใจดี" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>

      <div>
        <label for="reg-email" class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
        <input type="email" id="reg-email" name="email" required placeholder="name@example.com" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>

      <div>
        <label for="reg-password" class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
        <input type="password" id="reg-password" name="password" required placeholder="xxxx" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
      </div>

      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md transition-all active:scale-[0.98] cursor-pointer">
        Sign Up
      </button>
    </form>

  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>
  <!-- JavaScript สลับ Tab -->
  <script>
    function switchTab(type) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        loginForm.classList.add('flex');
        registerForm.classList.add('hidden');
        registerForm.classList.remove('flex');

        tabLogin.className = "w-1/2 pb-3 text-center text-lg font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-all cursor-pointer";
        tabRegister.className = "w-1/2 pb-3 text-center text-lg font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all cursor-pointer";
      } else {
        registerForm.classList.remove('hidden');
        registerForm.classList.add('flex');
        loginForm.classList.add('hidden');
        loginForm.classList.remove('flex');

        tabRegister.className = "w-1/2 pb-3 text-center text-lg font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-all cursor-pointer";
        tabLogin.className = "w-1/2 pb-3 text-center text-lg font-medium text-slate-400 hover:text-slate-600 border-b-2 border-transparent transition-all cursor-pointer";
      }
    }
  </script>
</body>
</html>
