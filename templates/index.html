<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าออนไลน์ — Mini Online Shop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛒 ร้านค้าออนไลน์ <span>Mini Online Shop</span></div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="employee">พนักงาน</button>
      <button class="mode-btn" data-mode="customer">ลูกค้า</button>
    </div>
    <nav id="mainNav"><a href="/" class="active">จัดการข้อมูล</a><a href="/report">รายงาน</a></nav>
  </header>

  <!-- ================= โหมดพนักงาน ================= -->
  <main class="container" id="employeeView">
    <div class="tabs">
      <button class="tab active" data-entity="customers">ผู้ใช้</button>
      <button class="tab" data-entity="products">สินค้า</button>
      <button class="tab" data-entity="categories">หมวดหมู่</button>
      <button class="tab" data-entity="orders">ออเดอร์</button>
      <button class="tab" data-entity="roles">สิทธิ์</button>
    </div>
    <section class="card">
      <h3>ค้นหา <span id="searchTitle"></span></h3>
      <div id="searchFields" class="search-grid"></div>
      <div class="btn-row">
        <button class="btn add" id="btnAdd">+ เพิ่มข้อมูลใหม่</button>
        <button class="btn" id="btnClear" style="margin-left:auto">ล้างเงื่อนไข</button>
        <button class="btn primary" id="btnSearch">🔍 ค้นหา</button>
      </div>
    </section>
    <section class="card">
      <div id="status" class="status"></div>
      <div class="table-wrap"><table id="resultTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
    </section>
  </main>

  <!-- ================= โหมดลูกค้า ================= -->
  <main class="container hidden" id="customerView">
    <section class="card">
      <h3>ข้อมูลลูกค้า</h3>
      <div class="search-grid">
        <div class="field">
          <label>เลือกลูกค้า</label>
          <select id="cpCustomer"><option value="">— เลือกลูกค้า —</option></select>
        </div>
        <div class="field">
          <label>ยอดเงินคงเหลือ</label>
          <div class="wallet"><span id="cpMoney">—</span> บาท <span class="badge" id="cpTier">—</span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>ที่อยู่จัดส่ง</h3>
      <div class="btn-row"><button class="btn add" id="cpBtnAddAddress">+ เพิ่มที่อยู่</button></div>
      <div id="cpAddrStatus" class="status"></div>
      <div class="table-wrap"><table id="cpAddrTable">
        <thead><tr><th>ผู้รับ</th><th>บ้านเลขที่</th><th>ตำบล/แขวง</th><th>อำเภอ/เขต</th><th>จังหวัด</th><th>โทร</th></tr></thead>
        <tbody></tbody></table></div>
    </section>

    <section class="card">
      <h3>ประวัติการสั่งซื้อ</h3>
      <div class="btn-row"><button class="btn primary" id="cpBtnNewOrder">+ สร้างออเดอร์</button></div>
      <div id="cpOrderStatus" class="status"></div>
      <div class="table-wrap"><table id="cpOrderTable">
        <thead><tr><th>รหัส</th><th>วันที่</th><th>ยอดรวม</th><th>สถานะ</th><th>ที่อยู่</th></tr></thead>
        <tbody></tbody></table></div>
    </section>
  </main>

  <!-- modal พนักงาน (เดิม) -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">เพิ่มข้อมูล</h3>
      <div id="formFields"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnSave">บันทึก</button>
        <button class="btn" id="btnCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- modal ลูกค้า: เพิ่มที่อยู่ -->
  <div id="addrModal" class="modal hidden">
    <div class="modal-box">
      <h3>เพิ่มที่อยู่</h3>
      <div id="addrFields"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnAddrSave">บันทึก</button>
        <button class="btn" id="btnAddrCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- modal ลูกค้า: สร้างออเดอร์ -->
  <div id="orderModal" class="modal hidden">
    <div class="modal-box wide">
      <h3>สร้างออเดอร์</h3>
      <div class="field"><label>ที่อยู่จัดส่ง</label><select id="omAddress"></select></div>
      <div class="field-label">รายการสินค้า</div>
      <div id="omItems"></div>
      <div class="btn-row"><button class="btn" id="omAddItem">+ เพิ่มรายการ</button></div>
      <div class="order-total">ยอดรวม: <b id="omTotal">0.00</b> บาท</div>
      <div class="btn-row">
        <button class="btn primary" id="btnOrderSave">ยืนยันสร้างออเดอร์</button>
        <button class="btn" id="btnOrderCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='customer.js') }}"></script>
</body>
</html>
