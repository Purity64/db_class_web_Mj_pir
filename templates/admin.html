<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านขาย id game roblox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛒 ร้านขาย id game roblox</div>
    <nav><a href="/admin" class="active">จัดการข้อมูล</a><a href="/report">รายงาน</a></nav>
  </header>
  <main class="container">
    <div class="tabs">
      <button class="tab active" data-entity="customers">user</button>
      <button class="tab" data-entity="products">สินค้า</button>
      <button class="tab" data-entity="orders">ออเดอร์</button>
      <button class="tab" data-entity="code">โค้ดส่วนลด</button>
    </div>
    <section class="card">
      <h3>ค้นหา <span id="searchTitle"></span></h3>
      <div id="searchFields" class="search-grid"></div>
      <div class="btn-row">
        <button class="btn add" id="btnAdd">+ เพิ่มข้อมูลใหม่</button>
        <button class="btn" id="btnClear" style="margin-left:auto">ล้างเงื่อนไข</button>
        <button class="btn primary" id="btnSearch">🔍 ค้นหา</button>
      </div>
    </section>
    <section class="card">
      <div id="status" class="status"></div>
      <div class="table-wrap"><table id="resultTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
    </section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">เพิ่มข้อมูล</h3>
      <div id="formFields"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnSave">บันทึก</button>
        <button class="btn" id="btnCancel">ยกเลิก</button>
      </div>
    </div>
  </div>
  <div id="stockModal" class="modal hidden">
    <div class="modal-box" style="min-width:560px">
      <h3 id="stockTitle">📦 สต็อกสินค้า</h3>
      <div id="stockStatus" class="status"></div>
      <div class="table-wrap"><table id="stockTable">
        <thead><tr><th>#</th><th>username</th><th>password</th><th>use</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table></div>
      <div class="btn-row" style="margin-top:10px;align-items:center;flex-wrap:wrap;gap:8px">
        <input id="stockUser" type="text" placeholder="username" style="width:150px;padding:6px">
        <input id="stockPass" type="text" placeholder="password" style="width:150px;padding:6px">
        <button class="btn add" id="btnAddStock">+ เพิ่มสต็อก</button>
        <button class="btn" id="btnStockClose" style="margin-left:auto">ปิด</button>
      </div>
    </div>
  </div>
  <div id="stockEditModal" class="modal hidden">
    <div class="modal-box" style="min-width:360px">
      <h3>แก้ไขบัญชีสต็อก</h3>
      <div class="field"><label>username</label><input id="seUser" type="text"></div>
      <div class="field"><label>password</label><input id="sePass" type="text"></div>
      <div class="field"><label>use</label>
        <select id="seUse">
          <option value="0">0 — ยังไม่ออกของ</option>
          <option value="1">1 — ออกของแล้ว</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnStockEditSave">บันทึก</button>
        <button class="btn" id="btnStockEditCancel">ยกเลิก</button>
      </div>
    </div>
  </div>
  <div id="orderDetailModal" class="modal hidden">
    <div class="modal-box" style="max-width:760px">
      <h3 id="odTitle">ออเดอร์</h3>
      <div id="odStatus" class="status"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>สินค้า</th><th>จำนวน</th><th>ราคา/หน่วย</th><th>รวม</th>
                <th>บัญชี (username)</th><th>รหัสผ่าน</th></tr>
          </thead>
          <tbody id="odBody"></tbody>
        </table>
      </div>
      <div class="btn-row" style="justify-content:flex-end; margin-top:12px">
        <button class="btn" id="btnOdClose">ปิด</button>
      </div>
    </div>
  </div>
  <div id="reviewListModal" class="modal hidden">
    <div class="modal-box" style="max-width:720px">
      <h3 id="rlTitle">⭐ รีวิวสินค้า</h3>
      <div id="rlSummary" style="color:#666;font-size:14px;margin:6px 0 4px"></div>
      <div id="rlStatus" class="status"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ผู้รีวิว</th><th>ดาว</th><th>ความคิดเห็น</th><th>วันที่</th></tr>
          </thead>
          <tbody id="rlBody"></tbody>
        </table>
      </div>
      <div class="btn-row" style="justify-content:flex-end; margin-top:12px">
        <button class="btn" id="btnReviewListClose">ปิด</button>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
